# Build the ReviewScope images for amd64 + arm64 and publish them to Docker Hub.
#
# Triggers (deliberately no pull_request*: fork PRs never see the Docker Hub token):
#   tag v1.2.3      -> :1.2.3 and :latest
#   tag v1.2.3-rc1  -> :1.2.3-rc1 only (pre-releases never move :latest)
#   push to main    -> :main and :sha-<short>
#   manual run      -> :sha-<short>
#
# Needs repository settings (Settings > Secrets and variables > Actions):
#   variable DOCKERHUB_USERNAME, secret DOCKERHUB_TOKEN (Docker Hub PAT, Read & Write).
#
# Each image is built natively on an x86 and an arm64 runner (no QEMU emulation),
# pushed as <tag>-amd64 / <tag>-arm64, then joined into one multi-arch tag.

name: docker-publish

on:
  push:
    tags: ["v*"]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  NAMESPACE: ${{ vars.DOCKERHUB_USERNAME }}

jobs:
  tags:
    runs-on: ubuntu-24.04
    outputs:
      primary: ${{ steps.t.outputs.primary }}
      extra: ${{ steps.t.outputs.extra }}
    steps:
      - id: t
        run: |
          short="sha-${GITHUB_SHA::7}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            echo "primary=$version" >> "$GITHUB_OUTPUT"
            # Only stable releases (no "-rc1" style suffix) become :latest.
            if [[ "$version" != *-* ]]; then echo "extra=latest" >> "$GITHUB_OUTPUT"; fi
          elif [[ "$GITHUB_REF" == refs/heads/main ]]; then
            echo "primary=$short" >> "$GITHUB_OUTPUT"
            echo "extra=main" >> "$GITHUB_OUTPUT"
          else
            echo "primary=$short" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: tags
    strategy:
      fail-fast: false
      matrix:
        image:
          - { name: backend, context: ., dockerfile: src/backend/Dockerfile }
          - { name: frontend, context: src/frontend, dockerfile: src/frontend/Dockerfile }
          - { name: ollama, context: src/ollama, dockerfile: src/ollama/Dockerfile }
        arch:
          - { name: amd64, runner: ubuntu-24.04 }
          - { name: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/checkout@v4

      # The backend image is ~7 GB (CUDA torch on amd64); make room on the runner.
      - name: Free disk space
        if: matrix.image.name == 'backend'
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image.context }}
          file: ${{ matrix.image.dockerfile }}
          platforms: linux/${{ matrix.arch.name }}
          push: true
          provenance: false
          tags: ${{ env.NAMESPACE }}/reviewscope-${{ matrix.image.name }}:${{ needs.tags.outputs.primary }}-${{ matrix.arch.name }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}

  manifest:
    needs: [tags, build]
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [backend, frontend, ollama]
    steps:
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Join amd64 + arm64 into one multi-arch tag
        env:
          REPO: ${{ env.NAMESPACE }}/reviewscope-${{ matrix.image }}
          PRIMARY: ${{ needs.tags.outputs.primary }}
          EXTRA: ${{ needs.tags.outputs.extra }}
        run: |
          args=(-t "$REPO:$PRIMARY")
          if [[ -n "$EXTRA" ]]; then args+=(-t "$REPO:$EXTRA"); fi
          docker buildx imagetools create "${args[@]}" "$REPO:$PRIMARY-amd64" "$REPO:$PRIMARY-arm64"
          docker buildx imagetools inspect "$REPO:$PRIMARY"
