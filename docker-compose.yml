# Portable, CPU-only stack: runs on any machine with Docker.
#
# GPU hosts add an override file (compose merges it over this one):
#   docker-compose -f docker-compose.yml -f docker-compose.gpu.yml up -d    # nvidia-container-toolkit installed
#   docker-compose -f docker-compose.yml -f docker-compose.ltgpu.yml up -d  # ltgpu1 (old Docker, no toolkit)
# Or set COMPOSE_FILE once in .env so plain `docker-compose ...` picks it up, e.g.
#   COMPOSE_FILE=docker-compose.yml:docker-compose.ltgpu.yml
#
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
    ports:
      - "5533:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_CHAT_MODEL: llama3.2
      # Run the real reviewscope_ml pipeline (set true to fall back to the
      # fabricated pipeline). The api only reads this to decide which task to
      # enqueue and to answer GET /api/models.
      SIMULATE_ML: "false"
    # Apply DB migrations before serving so a fresh/rebuilt postgres volume always
    # has its schema (the app has no create_all on startup — schema is Alembic-only).
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    ports:
      - "8000:8000"
    volumes:
      - ./src/backend:/app
      - ./data:/workspace/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: src/backend/Dockerfile
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      REDIS_URL: redis://redis:6379/0
      SIMULATE_ML: "false"
      # CPU by default so the stack runs on any machine. GPU hosts switch this to
      # cuda via an override file (docker-compose.gpu.yml / docker-compose.ltgpu.yml).
      ML_DEVICE: cpu
      # The ML pipeline derives its cache/run dir from REVIEWSCOPE_ROOT; point it
      # at the mounted data volume so embeddings/clusters caches persist.
      REVIEWSCOPE_ROOT: /workspace
    command: celery -A app.worker.celery_app worker --loglevel=info
    volumes:
      - ./src/backend:/app
      - ./data:/workspace/data
    # Shares the ollama container's network namespace, so localhost:11434 reaches
    # Ollama. Recreating ollama therefore requires recreating the worker too.
    # (The labeler also honours OLLAMA_BASE_URL; docker-compose.release.yml uses that.)
    network_mode: "service:ollama"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_healthy

  ollama:
    # Custom image: the entrypoint pulls the label model on boot so the stack
    # "just works" with no manual `ollama pull` step (see src/ollama/).
    build:
      context: ./src/ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Healthy once the entrypoint has pulled every model in OLLAMA_MODELS, so the
    # worker never starts before labeling can succeed. First boot downloads
    # ~5 GB: retries * interval = 90 * 10s = 15 min budget.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/models-ready"]
      interval: 10s
      timeout: 5s
      retries: 90
      start_period: 15s
    environment:
      OLLAMA_CONTEXT_LENGTH: "8192"
      OLLAMA_KEEP_ALIVE: 10m
      # Label model (reviewscope_ml APP_LABEL_MODEL) and chat model (OLLAMA_CHAT_MODEL).
      OLLAMA_MODELS: gemma3:4b llama3.2

  frontend:
    build:
      context: ./src/frontend
    env_file: .env
    command: npm run dev -- --host 0.0.0.0
    ports:
      - "5173:5173"
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  postgres_data:
  ollama_data:
